version: '3.7'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "50051:50051"  # OTLP gRPC
      - "50052:50052"  # OTLP HTTP
      - "50080:8888"  # Prometheus metrics
    command: >
      --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_GRPC_SERVER_HOST_PORT: ":14250"  # Enable gRPC on default port
      COLLECTOR_HTTP_SERVER_HOST_PORT: ":14268"  # Enable HTTP collector on default port
    ports:
      - "50060:14250"  # Jaeger gRPC collector
      - "50061:14268"  # Jaeger HTTP collector
      - "16686:16686"  # Jaeger UI

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "50081:9090"  # Prometheus web UI exposed on port 50081
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
