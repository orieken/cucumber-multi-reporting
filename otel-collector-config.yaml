receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:50051
      http:
        endpoint: 0.0.0.0:50052

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: '0.0.0.0:50080'
  otlp:
    endpoint: 'tempo:4317'
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
