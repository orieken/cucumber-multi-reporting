receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:50051"  # gRPC on port 50051
      http:
        endpoint: "0.0.0.0:50052"  # HTTP on port 50052
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector-metrics'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']  # Collector's own metrics

exporters:
  otlp:
      endpoint:  jaeger:14268
      tls:
        insecure: true
  prometheus:
    endpoint: "0.0.0.0:50080"  # Expose Prometheus metrics on port 50080

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp]
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
